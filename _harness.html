<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#777;font:12px monospace;padding:6px}
pre{background:#000;color:#0f0;font-size:13px;padding:8px;margin:0 0 6px;white-space:pre-wrap;min-height:150px}
iframe{border:0;background:#fff;display:block;width:1150px;height:820px}
</style></head><body>
<pre id="out"></pre>
<iframe id="f" src="index.html#gallery"></iframe>
<script>
var out = document.getElementById("out");
var lines = [], n = 0;
function log(s){ lines.push((++n) + ". " + s); out.textContent = lines.join("\n"); }
function step(name, fn){
  try { var r = fn(); if (r !== undefined) log(name + " -> " + r); }
  catch(e){ log(name + " !! " + e.message); }
}
document.getElementById("f").addEventListener("load", function () {
  var d = this.contentDocument;
  setTimeout(function () {
    var $ = function(s){ return d.querySelector(s); };
    var $$ = function(s){ return d.querySelectorAll(s); };
    var click = function(s){ var e = $(s); if(!e) throw new Error("no node " + s); e.click(); };

    step("cells", function(){ return $$("#gui-left .gcell").length + " left + " +
        $$("#gui-right .gcell").length + " right, tui " + $$("#tui-grid > span").length +
        ", " + $("#tui-count").textContent; });
    step("popup width", function(){
      click("#gui-right [data-submenu='3']");
      return Math.round($("#gui-pop").getBoundingClientRect().width) + "px";
    });
    step("trigger again closes", function(){
      click("#gui-right [data-submenu='3']");
      return "hidden=" + $("#gui-pop").hidden;
    });
    step("reopen", function(){
      click("#gui-right [data-submenu='3']");
      return "hidden=" + $("#gui-pop").hidden + " rows=" + $$("#gui-pop button").length;
    });
    step("click elsewhere in GUI closes", function(){
      click("#gui-left .gcell[data-index='2']");   // Crashes, a plain category
      return "hidden=" + $("#gui-pop").hidden + " | Crashes=" +
        $("#gui-left .gcell[data-index='2'] .gchk").className;
    });
    step("other trigger switches popup", function(){
      click("#gui-left [data-submenu='3']");
      var a = $("#gui-pop h4").textContent;
      click("#gui-left [data-submenu='5']");
      return a + " -> " + $("#gui-pop h4").textContent;
    });
    step("click outside card closes", function(){
      click("#tui-grid > span[data-index='0']");
      return "hidden=" + $("#gui-pop").hidden;
    });
    step("Escape closes", function(){
      click("#gui-left [data-submenu='3']");
      var open = !$("#gui-pop").hidden;
      d.dispatchEvent(new KeyboardEvent("keydown", {key:"Escape", bubbles:true}));
      return "wasOpen=" + open + " hidden=" + $("#gui-pop").hidden;
    });
    step("tristate via popup", function(){
      click("#gui-left [data-submenu='3']");
      $$("#gui-pop button")[0].click();
      var cls = $("#gui-left .gcell[data-index='3'] .gchk").className;
      return cls + " | tui '" + $("#tui-grid > span[data-index='3']").textContent.trim() + "'";
    });
    step("terminal keys", function(){
      var f = $("#tui-frame"); f.focus();
      ["ArrowDown","ArrowRight"].forEach(function(k){
        f.dispatchEvent(new KeyboardEvent("keydown", {key:k, bubbles:true}));
      });
      var foc = $("#tui-grid > span.is-focus");
      var idx = foc ? foc.dataset.index : "?";
      f.dispatchEvent(new KeyboardEvent("keydown", {key:" ", bubbles:true}));
      var after = $("#tui-grid > span.is-focus").textContent.trim();
      f.dispatchEvent(new KeyboardEvent("keydown", {key:"Enter", bubbles:true}));
      var pop = !$("#tui-pop").hidden;
      f.dispatchEvent(new KeyboardEvent("keydown", {key:"Escape", bubbles:true}));
      return "focus=" + idx + " afterSpace='" + after + "' enterPopup=" + pop +
             " escClosed=" + $("#tui-pop").hidden;
    });
    log("DONE");
  }, 1000);
});
</script></body></html>
